[package]
name = "grp2obj-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "extract_grp"
path = "rust/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
oozextract = "0.5"
zstd = "0.13"
